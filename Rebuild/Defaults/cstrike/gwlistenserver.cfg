alias p0 "pausable 0; echo [SERVER] Client ability to pause the game now is OFF; say [SERVER] Client ability to pause the game now is OFF"
alias p1 "pausable 1; echo [SERVER] Client ability to pause the game now is ON; say [SERVER] Client ability to pause the game now is ON"
alias cbble "changelevel de_cbble"
alias dust2 "changelevel de_dust2"
alias inferno "changelevel de_inferno"
alias nuke "changelevel de_nuke"
alias train "changelevel de_train"


