// useless aliases :(
alias r1 "sv_restart 1"
alias r2 "sv_restart 2"
alias r3 "sv_restart 3"
alias r4 "sv_restart 4"
alias r5 "sv_restart 5"
alias 800 "mp_startmoney 800; echo [SERVER] Startmoney now is 800; say [SERVER] Startmoney now is 800"
alias 16000 "mp_startmoney 16000; echo [SERVER] Startmoney now is 16000; say [SERVER] Startmoney now is 16000"
alias f0 "mp_fadetoblack 0; echo [SERVER] Fade to black now is OFF; say [SERVER] Fade to black now is OFF"
